name: gate-nofilter
on:
  workflow_run:
    workflows: ["Build & Tests"]
    types: [completed]
permissions: {}
jobs:
  observe:
    name: Observe upstream run (no branches filter)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - run: |
          echo "UP_EVENT=${{ github.event.workflow_run.event }}"
          echo "UP_HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "UP_CONCLUSION=${{ github.event.workflow_run.conclusion }}"
  gated:
    name: Gated deploy (zerocopy docs.yml gate)
    runs-on: ubuntu-latest
    needs: observe
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - run: echo "GATE_PASSED"

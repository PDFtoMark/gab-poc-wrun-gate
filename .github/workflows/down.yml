name: gate
on:
  workflow_run:
    workflows: ["Build & Tests"]
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  observe:
    name: Observe upstream context
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: ctx
        run: |
          echo "UP_EVENT=${{ github.event.workflow_run.event }}"
          echo "UP_HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "UP_HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
          echo "UP_HEAD_REPO=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "UP_CONCLUSION=${{ github.event.workflow_run.conclusion }}"
          echo "TRIGGER_RUN_ID=${{ github.event.workflow_run.id }}"
  gated:
    name: Gated deploy (zerocopy docs.yml gate)
    runs-on: ubuntu-latest
    needs: observe
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - run: echo "GATE_PASSED"
